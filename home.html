<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home | Artist Hub</title>
    
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { electric: '#0052FF', darkBg: '#000000', darkSurface: '#0a0a0a' } } }
        }

        const theme = localStorage.getItem('theme_preference');
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-darkBg dark:text-gray-100 h-[100dvh] w-screen flex flex-col transition-colors duration-300 relative overflow-hidden">

    <!-- Top Bar Container -->
    <header id="top-bar-container" class="sticky top-0 z-40 bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-gray-200 dark:border-white/10"></header>

    <!-- Main Scrollable Area -->
    <main class="flex-1 overflow-y-auto overflow-x-hidden pb-24 no-scrollbar">
        <!-- Horizontal List Container -->
        <section id="list-container" class="w-full py-4 pl-4 border-b border-gray-200 dark:border-white/5"></section>
        
        <!-- Feed Container -->
        <section id="feed-container" class="w-full max-w-lg mx-auto flex flex-col gap-6 pt-6 px-4"></section>
    </main>

    <!-- Bottom Menu Container -->
    <nav id="bottom-menu-container" class="fixed bottom-0 w-full z-50 bg-white/90 dark:bg-black/90 backdrop-blur-xl border-t border-gray-200 dark:border-white/10 pb-safe"></nav>

    <!-- App Logic & Component Injection -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        // Import your UI Components
        import { renderSearchBar } from './js/search_bar.js';
        import { renderList } from './js/list.js';
        import { renderFeed } from './js/feed.js';
        import { renderBottomMenu } from './js/bottom_menu.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCANvRaHEUA7wkWMhC9_hFyrzU8cjoUo2U",
            authDomain: "thuggish-2cd07.firebaseapp.com",
            projectId: "thuggish-2cd07",
            storageBucket: "thuggish-2cd07.firebasestorage.app",
            messagingSenderId: "221865053567",
            appId: "1:221865053567:web:ad8960c0136ac524269e4a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Check Auth and Load Data
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Fetch user data for the top bar profile picture
                const userDoc = await getDoc(doc(db, "users", user.uid));
                const userData = userDoc.exists() ? userDoc.data() : { photoURL: null };
                
                // Initialize UI
                renderSearchBar('top-bar-container', userData.photoURL);
                renderList('list-container');
                renderFeed('feed-container');
                renderBottomMenu('bottom-menu-container');
            } else {
                window.location.replace("index.html");
            }
        });
    </script>
</body>
</html>
